<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — CatchLog</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="landing-nav">
    <a href="index.html" class="brand">
      <img src="images/a-fish-logo_10924291.png" alt="Fishing Logo" height="32">
      Catch Log
    </a>
  </nav>

  <main class="form-page">
    <div class="form-card">
      <h2>Log in</h2>
      <p class="form-sub">Welcome back</p>

      <form action="records.html" method="post">
        <fieldset style="border: none; padding: 0;">
          <legend style="display: none;">Account Information</legend>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email address" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>

          <input type="submit" value="Log in" class="btn-primary form-submit">
        </fieldset>
      </form>

      <p class="form-footer">
        Don't have an account? <a href="registration.html">Register</a>
      </p>
    </div>
  </main>

  <footer>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="mailto:miguel.soriano@rdpolytech.ca">Contact Us</a></li>
    </ul>
    <p>&copy; 2025 Fishing Logging System. All rights reserved.</p>
  </footer>

</body>
</html>
