<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — CatchLog</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav>
      <a href="records.html" class="brand">
        <img src="images/a-fish-logo_10924291.png" alt="Fishing Logo" height="32">
        Catch Log
      </a>
      <ul class="nav-links">
         <li><a href="catchlog.html">Log a Catch</a></li>
        <li><a href="records.html">My Records</a></li>
        <li><a href="statistics.html">Statistics</a></li>
      </ul>
      <ul class="nav-right">
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="index.html" class="btn-logout logout-link">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h2>My Profile</h2>
      <p class="form-sub">Your account information</p>

      <hr>

      <div class="field">
        <label>Email</label>
        <p id="userEmail">—</p>
      </div>

      <div class="field">
        <label>WIN Number</label>
        <p id="userWin">—</p>
      </div>

      <div class="field">
        <label>Phone Number</label>
        <p id="userPhone">—</p>
      </div>

      <hr>

      <form id="profileForm">
        <label>Current Password</label>
        <input type="password" id="current_password" name="current_password" placeholder="Enter current password">

        <label>New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password">

        <label>Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password">

        <p id="profileError" style="display: none; color: red; font-size: 13px; margin-top: 8px;"></p>

        <input type="submit" value="Update Password" class="btn-primary form-submit">
      </form>

    </div>
  </main>

  <footer>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="mailto:miguel.soriano@rdpolytech.ca">Contact Us</a></li>
    </ul>
    <p>&copy; 2026 Fishing Logging System. All rights reserved.</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
