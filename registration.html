<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
        <title>Registration</title>
    </head>
    <body>
        <header>
            <h1>Create an Account</h1>
        </header>
        <main>
            <form id="registrationForm" action="login.html" method="post">
                <fieldset>
                    <legend>Account Information</legend>

                    <label for="username">Username:</label> 
                    <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>
                
                    <label for="email">Email:</label> 
                    <input type="email" id="email" name="email" placeholder="Enter email" required><br><br>
                
                    <label for="win_number">WIN Number:</label> 
                    <input type="number" id="win_number" name="win_number" placeholder="Enter WIN number" maxlength="10" required><br><br>
                
                    <label for="phone">Phone Number:</label> 
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"> (Optional)<br><br>
                
                    <label for="password">Password:</label> 
                    <input type="password" id="password" name="password" placeholder="Create a password" required><br><br>
                
                    <label for="confirm_password">Confirm Password:</label> 
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required><br><br>
                
                    <input type="submit" value="Register"><br><br>
                </fieldset>
            </form>
        </main>
        <footer>
        <hr>

            </ul>

        </footer>
    </body>
</html>
